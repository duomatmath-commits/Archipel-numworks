
name: Build Archipel Englouti for NumWorks

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi make nodejs npm unzip

      - name: Extract game files
        run: |
          unzip -q Archipel_Englouti_NumWorks_V6_compilation_en_ligne.zip -d source
          ls source/archipel_numworks

      - name: Build NWA
        run: |
          make -C source/archipel_numworks clean
          make -C source/archipel_numworks build
          test -s source/archipel_numworks/output/Archipel_Englouti.nwa

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Archipel-Englouti-NWA
          path: source/archipel_numworks/output/Archipel_Englouti.nwa

